[project]
name = "vn-mirror-archiver"
version = "0.1.0"
description = "Preserve VN demos, patches, movies, and their provenance"
requires-python = ">=3.11"
dependencies = ["boto3>=1.36,<2"]

[project.scripts]
vn-archive = "archiver:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["archiver.py", "vndb.py", "drive_download.py", "hanny.py", "hanny_mods.py", "hanny_sources.toml", "archive_lock.py", "archive_watch.py", "provenance_watch.py", "mirror_sources.py", "mirror_history.py", "mirror_reparse.py", "mirror_sources.toml", "portals.py", "suezou_watch.py", "catalog.py", "bulk.py", "wayback_recovery.py", "holy_inventory.py", "erogamescape.py", "erogamescape_full.py", "official.py", "sources.toml", "web"]
